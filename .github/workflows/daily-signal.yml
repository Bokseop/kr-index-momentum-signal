name: Daily Signal Update (Solution 1)

on:
  schedule:
    # 평일 오전 08:40 KST (UTC 23:40, 일~목) — KOFIA DIS 전일 종가 기준가 공시 직후 실행
    - cron: "40 23 * * 0-4"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "ntfy 스마트폰 테스트 푸시 즉시 발송 여부"
        type: boolean
        default: true
      strategy_id:
        description: "알림 기준 전략 (기본: ma100_full)"
        type: choice
        default: "ma100_full"
        options:
          - ma100_full
          - ma100_half
          - ma100_quarter
          - ma100_fixed
          - ma80_full
          - ma60_full

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Solution 1 Live Signal Engine & ntfy Notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_STRATEGY_ID: ${{ github.event.inputs.strategy_id || 'ma100_full' }}
          NTFY_FORCE_SEND: ${{ github.event.inputs.test_notify || 'false' }}
        run: python signal_domestic_2index.py

      - name: Commit and push updated signal dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "chore: update daily domestic 2-index signal ($(TZ=Asia/Seoul date +'%Y-%m-%d'))"
            git push
          fi

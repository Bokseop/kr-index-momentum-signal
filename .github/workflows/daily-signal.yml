name: "Daily Signal Update (Option A - Trend + KOSDAQ150 Swing)"

on:
  schedule:
    # 평일 오전 08:40 KST (UTC 23:40, 일~목) — KOFIA DIS 전일 종가 기준가 공시 직후 실행
    - cron: "40 23 * * 0-4"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "ntfy 스마트폰 테스트 푸시 즉시 발송 여부"
        type: boolean
        default: true
      strategy_id:
        description: "알림 기준 전략 (기본: ma100_full_overlay25)"
        type: choice
        default: "ma100_full_overlay25"
        options:
          - ma100_full_overlay25
          - ma100_full_pair60
          - ma100_full_split75
          - ma100_full_none
          - ma100_half_overlay25
          - ma100_half_pair60
          - ma100_half_split75
          - ma80_full_overlay25
          - ma60_full_overlay25
          - ma60_full_pair60

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Option A Live Signal Engine & ntfy Notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_STRATEGY_ID: ${{ github.event.inputs.strategy_id || 'ma100_full_overlay25' }}
          NTFY_FORCE_SEND: ${{ github.event.inputs.test_notify || 'false' }}
        run: python signal_domestic_2index.py

      - name: Commit and push updated signal dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/kodex_200_nav.csv data/kodex_kosdaq150_nav.csv data/kodex_kofr_nav.csv
          if git diff --staged --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "chore: update daily Option A signal ($(TZ=Asia/Seoul date +'%Y-%m-%d'))"
            git push
          fi
